# =========================================================
# openai_chroma_hybrid_reranker.yaml
#
# 목적:
# - OpenAI embedding + OpenAI LLM + Chroma VectorDB 기반 RAG 실험
# - section embedding_text + Hybrid Search + Reranker 적용
# - 기존 baseline_openai_chroma 실험과 결과/벡터DB가 섞이지 않도록 experiment.name 분리
#
# 실행 전 필요:
# - OPENAI_API_KEY 환경변수 또는 .env 설정
# - chromadb 패키지 설치
# - reranker 사용 시 sentence-transformers 설치
#   pip install sentence-transformers
# =========================================================

# =========================================================
# 원본 데이터 추출 / 정제 / 청킹 설정
# =========================================================

extract:

  raw_dir: data/raw
  data_list_path: data/raw/data_list.csv
  extracted_dir: data/processed/extracted
  cleaned_dir: data/processed/cleaned
  output_chunk_path: data/chunks/section/section_chunks.jsonl
  process_log_path: logs/extract_clean_chunk_log.csv

  columns:
    doc_id: 공고 번호
    file_name: 파일명
    file_type: 파일형식
    project_name: 사업명
    organization: 발주 기관

  chunking:
    # 기존 3000/300/100보다 검색 precision을 높이기 위해 축소
    max_chars: 1500
    overlap_chars: 200
    min_chars: 30

  # chunker에 embedding_text 로직이 추가되었으므로 반드시 true
  force_rebuild_chunks: true


# =========================================================
# 실험 기본 정보
# =========================================================

experiment:
  name: openai_chroma_hybrid_reranker
  description: OpenAI Embedding + OpenAI LLM + Chroma RAG with embedding_text, hybrid search, and reranker
  random_seed: 42


# =========================================================
# 전체 경로 설정
# =========================================================

paths:
  chunk_path: data/chunks/section/section_chunks.jsonl
  eval_dataset_path: data/processed/eval/eval_dataset.json
  eval_sample_path: data/processed/eval/eval_dataset_sample_20.json

  vector_db_dir: data/vector_db

  rag_output_path: data/processed/eval/rag_outputs.json
  rag_output_scored_path: data/processed/eval/rag_outputs_scored.json

  report_dir: reports/evaluation


# =========================================================
# Chunking 전략
# =========================================================

chunking:
  strategy: section


# =========================================================
# Embedding 설정
# =========================================================

embedding:

  provider: openai

  # HF 실험용 fallback 값입니다. OpenAI 실험에서는 사용하지 않습니다.
  hf_model_name: nlpai-lab/KURE-v1

  openai_model_name: text-embedding-3-small

  batch_size: 32
  normalize_embeddings: true

  # embedding_text / chunk 크기 / hybrid 실험 반영을 위해 true
  force_rebuild_index: true

  device: null
  reload_query_embedder_on_cpu: false


# =========================================================
# Vector DB 설정
# =========================================================

vector_db:

  type: faiss

  stores:

    faiss:
      persist_dir: data/vector_db/faiss_openai
      index_file: index.faiss
      chunk_meta_file: chunks.pkl
      config_file: config.json

    chroma:
      persist_dir: data/vector_db/chroma_openai
      collection: rfp_openai_rag

    qdrant:
      url: http://localhost:6333
      api_key_env: QDRANT_API_KEY
      collection: rfp_openai_rag

    supabase:
      url_env: SUPABASE_URL
      key_env: SUPABASE_SERVICE_ROLE_KEY
      table: rfp_chunks
      match_function: match_rfp_chunks


# =========================================================
# Retrieval 설정
# =========================================================

retrieval:
  # 최종 LLM에 넣을 청크 개수
  top_k: 5

  # Dense 후보 검색 개수입니다.
  # hybrid/reranker 적용 시 top_k보다 크게 잡아야 효과가 있습니다.
  candidate_k: 30

  # ---------------------------------------------------------
  # Hybrid Search 설정
  # ---------------------------------------------------------
  hybrid:
    enabled: true

    # BM25도 embedding_text 기준으로 검색합니다.
    # 즉, 사업명/발주기관/섹션경로/섹션제목이 BM25 검색에도 반영됩니다.
    text_key: embedding_text

    dense_candidate_k: 30
    bm25_candidate_k: 30

    # RRF fusion 가중치
    # RFP 문서는 키워드가 중요하지만, semantic search도 유지해야 하므로 0.65 / 0.35부터 시작
    dense_weight: 0.7
    bm25_weight: 0.3

    # Reciprocal Rank Fusion의 안정화 상수
    rrf_k: 60

    # BM25 파라미터
    k1: 1.5
    b: 0.75

  # ---------------------------------------------------------
  # Reranker 설정
  # ---------------------------------------------------------
  reranker:
    enabled: True

    # 한국어 reranker 후보
    model_name: upskyy/ko-reranker-8k

    batch_size: 16
    max_length: 512

    # CUDA 환경이면 cuda, GPU 없으면 cpu로 변경
    device: cuda


# =========================================================
# LLM 설정
# =========================================================

llm:

  provider: openai

  # HF 실험용 fallback 값입니다. OpenAI 실험에서는 사용하지 않습니다.
  hf_model_name: LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct

  openai_model_name: gpt-5-mini
  fallback_model_name: gpt-5-nano

  max_output_tokens: 512
  max_new_tokens: 512

  temperature: 0.0
  do_sample: false
  trust_remote_code: true

  max_chars_per_chunk: 1500
  include_metadata: true


# =========================================================
# OpenAI API 설정
# =========================================================

openai:
  api_key_env: OPENAI_API_KEY

  embedding_model: text-embedding-3-small
  llm_model: gpt-5-mini
  fallback_llm_model: gpt-5-nano


# =========================================================
# 평가 설정
# =========================================================

evaluation:
  sample_size: 20
  keyword_failure_threshold: 1.0


# =========================================================
# 사람 직접 평가 설정
# =========================================================

human_eval:
  enabled: true
  output_csv: reports/real_user_eval_sheet.csv